<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">TANGLEDDAUNT's GitHub arcade</title>
  <desc id="desc">A black, white, and muted red pixel-art night scene. Pac-Man chases a red ghost through an arcade maze beneath the words Hi, this is TANGLEDDAUNT and his GitHub.</desc>
  <style>
    .pixel { shape-rendering: crispEdges; }
    .star { animation: blink 1.8s steps(1,end) infinite; }
    .star.two { animation-delay: .55s; }
    .star.three { animation-delay: 1.1s; }

    .pac-group { animation: chase 6s ease-in-out forwards; }
    .pac-path { fill: #f2f0e8; }
    .mouth { animation: chomp 0.15s steps(2,end) forwards; fill: #080808; }

    .ghost-group { opacity: 1; animation: ghostFade 0.3s ease-out forwards; animation-delay: 5.5s; }

    .gameover { opacity: 0; animation: fadeIn 0.5s ease-in forwards; animation-delay: 5.8s; }

    @keyframes blink { 0%, 42% { opacity:.14 } 43%, 100% { opacity:1 } }

    @keyframes chomp {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes chase {
      0%   { transform: translateX(0); }
      12%  { transform: translateX(150px); }
      20%  { transform: translateX(150px) translateY(52px); }
      35%  { transform: translateX(350px) translateY(52px); }
      45%  { transform: translateX(350px) translateY(0); }
      65%  { transform: translateX(550px) translateY(0); }
      75%  { transform: translateX(550px); }
      100% { transform: translateX(550px); opacity: 0; }
    }

    @keyframes ghostFade {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    @keyframes fadeIn {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }
  </style>

  <rect width="900" height="420" fill="#080808"/>

  <!-- Stars -->
  <g class="pixel" fill="#f2f0e8">
    <rect x="39" y="52" width="3" height="3" class="star"/><rect x="106" y="88" width="3" height="3" class="star two"/>
    <rect x="211" y="43" width="3" height="3" class="star three"/><rect x="330" y="78" width="3" height="3" class="star"/>
    <rect x="574" y="48" width="3" height="3" class="star two"/><rect x="700" y="77" width="3" height="3" class="star three"/>
    <rect x="842" y="43" width="3" height="3" class="star"/>
  </g>

  <!-- Title -->
  <g fill="#f2f0e8" font-family="monospace" text-anchor="middle" shape-rendering="crispEdges">
    <text x="450" y="123" font-size="30" font-weight="bold" letter-spacing="2">HI, THIS IS TANGLEDDAUNT</text>
    <text x="450" y="158" font-size="18" letter-spacing="7">AND HIS GITHUB</text>
  </g>

  <!-- Maze walls -->
  <g class="pixel" fill="#d9d7cf">
    <!-- Outer walls -->
    <rect x="98" y="192" width="704" height="5"/>
    <rect x="98" y="192" width="5" height="156"/>
    <rect x="797" y="192" width="5" height="156"/>
    <rect x="98" y="343" width="704" height="5"/>

    <!-- Internal walls -->
    <rect x="150" y="234" width="120" height="5"/>
    <rect x="150" y="234" width="5" height="54"/>
    <rect x="150" y="283" width="70" height="5"/>
    <rect x="308" y="234" width="5" height="54"/>
    <rect x="308" y="283" width="108" height="5"/>
    <rect x="475" y="234" width="108" height="5"/>
    <rect x="578" y="234" width="5" height="54"/>
    <rect x="643" y="234" width="107" height="5"/>
    <rect x="745" y="234" width="5" height="54"/>
    <rect x="250" y="313" width="400" height="5"/>
  </g>

  <!-- Dots -->
  <g fill="#d9d7cf" class="pixel">
    <rect x="119" y="216" width="5" height="5"/><rect x="135" y="216" width="5" height="5"/><rect x="286" y="216" width="5" height="5"/><rect x="441" y="216" width="5" height="5"/><rect x="458" y="216" width="5" height="5"/><rect x="602" y="216" width="5" height="5"/><rect x="619" y="216" width="5" height="5"/><rect x="768" y="216" width="5" height="5"/>
    <rect x="119" y="326" width="5" height="5"/><rect x="135" y="326" width="5" height="5"/><rect x="227" y="299" width="5" height="5"/><rect x="680" y="299" width="5" height="5"/><rect x="768" y="326" width="5" height="5"/>
  </g>

  <!-- Ghost -->
  <g class="ghost-group">
    <path d="M730 259v-17c0-18 30-18 30 0v17l-5 6-5-6-5 6-5-6-5 6z" fill="#9f3636" class="pixel"/>
    <rect x="737" y="243" width="5" height="6" fill="#080808" class="pixel"/>
    <rect x="750" y="243" width="5" height="6" fill="#080808" class="pixel"/>
  </g>

  <!-- Pac-Man -->
  <g class="pac-pixel" transform="translate(120, 215)">
    <g class="pac-group">
      <path class="pac-path pixel" d="M0 0 v25 h20 l12 -12.5 l-12 -12.5 h-20 z"/>
      <path class="mouth pixel" d="M20 0 h20 l-12 12.5 l12 12.5 h-20 z"/>
    </g>
  </g>

  <!-- GAME OVER text -->
  <text x="450" y="280" font-family="monospace" font-size="24" font-weight="bold" fill="#9f3636" text-anchor="middle" class="gameover">GAME OVER</text>

  <!-- READY/LIVE -->
  <g font-family="monospace" fill="#9f3636" font-size="11" letter-spacing="2">
    <text x="102" y="379">READY_</text>
    <text x="718" y="379">● LIVE</text>
  </g>

  <!-- Bottom lines -->
  <g class="pixel" fill="#f2f0e8" opacity=".55">
    <rect x="78" y="398" width="744" height="1"/>
    <rect x="78" y="407" width="510" height="1"/>
  </g>
</svg>